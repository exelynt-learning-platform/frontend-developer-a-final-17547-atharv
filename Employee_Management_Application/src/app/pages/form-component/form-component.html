<div
  #employeeModal
  class="modal fade"
  tabindex="-1"
  aria-labelledby="employeeModalTitle"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <section class="modal-content" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="employeeModalTitle">{{ isEditing ? 'Edit employee' : 'Add employee' }}</h2>
        <button class="btn-close" type="button" aria-label="Close" (click)="onClose()">
          close
        </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="employee-form">
          @for (field of ['name', 'email', 'mobile', 'state', 'district']; track field) {
            <label>
              {{ field | titlecase }}
              <input
                [type]="field === 'email' ? 'email' : 'text'"
                [attr.inputmode]="field === 'mobile' ? 'numeric' : null"
                [formControlName]="field"
                (input)="onInput(field, $event)"
              />
              <small>{{ employeeForm.get(field)?.touched ? fieldError(field) : '' }}</small>
            </label>
          }
          <label>
            Country
            <select formControlName="countryId">
              <option value="" disabled>
                @if (countriesLoading) {
                  Loading countries...
                } @else if (countriesError) {
                  Countries unavailable
                } @else {
                  Choose country
                }
              </option>
              @for (country of countries; track country.id) {
                <option [value]="country.id">{{ country.country }}</option>
              }
            </select>
            <small>{{
              employeeForm.controls.countryId.touched ? fieldError('countryId') : ''
            }}</small>
          </label>
          @if (countriesLoading) {
            <p class="status form-status">Loading countries...</p>
          }
          @if (countriesError) {
            <p class="error form-status">{{ countriesError }}</p>
          }
          <button class="primary form-submit" type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Saving...' : isEditing ? 'Save changes' : 'Create employee' }}
          </button>
        </form>
      </div>
    </section>
  </div>
</div>
